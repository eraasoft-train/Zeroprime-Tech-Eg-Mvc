<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="Illustration of a smart city with autonomous waste management infrastructure">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff3e8"/>
      <stop offset="1" stop-color="#f4faf6"/>
    </linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6b4b"/>
      <stop offset="1" stop-color="#1c4630"/>
    </linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d7d57"/>
      <stop offset="1" stop-color="#24503a"/>
    </linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#588f6f"/>
      <stop offset="1" stop-color="#33604a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="420" fill="url(#sky)"/>
  <circle cx="730" cy="96" r="110" fill="url(#sun)"/>
  <circle cx="730" cy="96" r="44" fill="#ffd166"/>

  <!-- Distant skyline -->
  <g opacity="0.55" fill="#8fb8a1">
    <rect x="0" y="220" width="70" height="200" rx="3"/>
    <rect x="86" y="180" width="52" height="240" rx="3"/>
    <rect x="150" y="240" width="88" height="180" rx="3"/>
    <rect x="700" y="230" width="60" height="190" rx="3"/>
    <rect x="778" y="190" width="46" height="230" rx="3"/>
    <rect x="842" y="245" width="118" height="175" rx="3"/>
  </g>

  <!-- Mid buildings -->
  <path d="M250 420 L250 190 L340 190 L340 420 Z" fill="url(#b2)"/>
  <path d="M356 420 L356 120 L470 120 L470 420 Z" fill="url(#b1)"/>
  <path d="M486 420 L486 230 L560 230 L560 420 Z" fill="url(#b3)"/>
  <path d="M60 420 L60 280 L150 280 L150 420 Z" fill="url(#b3)"/>

  <!-- Windows -->
  <g fill="#ffd166" opacity="0.85">
    <rect x="275" y="215" width="14" height="14" rx="2" opacity="0.35"/><rect x="305" y="215" width="14" height="14" rx="2"/><rect x="275" y="250" width="14" height="14" rx="2"/><rect x="305" y="250" width="14" height="14" rx="2" opacity="0.35"/><rect x="275" y="285" width="14" height="14" rx="2"/><rect x="305" y="285" width="14" height="14" rx="2"/>
    <rect x="382" y="145" width="15" height="15" rx="2"/><rect x="415" y="145" width="15" height="15" rx="2" opacity="0.35"/><rect x="448" y="145" width="15" height="15" rx="2"/><rect x="382" y="185" width="15" height="15" rx="2" opacity="0.35"/><rect x="415" y="185" width="15" height="15" rx="2"/><rect x="448" y="185" width="15" height="15" rx="2" opacity="0.35"/><rect x="382" y="225" width="15" height="15" rx="2"/><rect x="415" y="225" width="15" height="15" rx="2" opacity="0.35"/><rect x="448" y="225" width="15" height="15" rx="2"/>
    <rect x="512" y="255" width="13" height="13" rx="2"/><rect x="540" y="255" width="13" height="13" rx="2" opacity="0.35"/><rect x="512" y="290" width="13" height="13" rx="2" opacity="0.35"/><rect x="540" y="290" width="13" height="13" rx="2"/>
  </g>

  <!-- Rooftop greenery -->
  <path d="M356 120 L413 84 L470 120 Z" fill="#173d2b"/>
  <path d="M250 190 L295 158 L340 190 Z" fill="#274b36"/>
  <circle cx="413" cy="70" r="7" fill="#ffd166"/>

  <!-- Recycling orbit arrows -->
  <g transform="translate(660,210)" stroke="#1d7a4f" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M 22.2 -15.7 A 27 27 0 0 1 15.7 22.2"/>
    <path d="M 22.2 -15.7 A 27 27 0 0 1 15.7 22.2" transform="rotate(120)"/>
    <path d="M 22.2 -15.7 A 27 27 0 0 1 15.7 22.2" transform="rotate(240)"/>
  </g>
  <path d="M0,-10.5 C7.9,-10.5 11,-2.7 0,12.6 C-11,-2.7 -7.9,-10.5 0,-10.5 Z" transform="translate(660,210)" fill="#f0a202"/>

  <!-- Ground -->
  <rect y="392" width="960" height="28" fill="#10382a"/>

  <!-- CanBank kiosk -->
  <g transform="translate(650,296)">
    <rect x="0" y="0" width="132" height="98" rx="10" fill="#0e3b29"/>
    <rect x="0" y="0" width="132" height="14" rx="7" fill="#f0a202"/>
    <rect x="16" y="28" width="100" height="34" rx="6" fill="#07281c" stroke="#4ade80" stroke-opacity="0.5"/>
    <g transform="translate(66,45)" stroke="#4ade80" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M-6,-9 h12 v15 a6,6 0 0 1 -12,0 z"/>
      <path d="M-6,-4.5 h12"/>
    </g>
    <rect x="30" y="72" width="72" height="9" rx="4.5" fill="#ffd166"/>
  </g>
</svg>
