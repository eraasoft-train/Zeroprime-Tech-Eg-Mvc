<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" role="img" aria-label="CanBank reverse vending machine illustration">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d5c3b"/>
      <stop offset="0.55" stop-color="#143f2b"/>
      <stop offset="1" stop-color="#0d2b1f"/>
    </linearGradient>
    <linearGradient id="canopy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0a202"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a241b"/>
      <stop offset="1" stop-color="#071710"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07281c"/>
      <stop offset="1" stop-color="#0b1f16"/>
    </linearGradient>
    <linearGradient id="can" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cbd5ce"/>
      <stop offset="0.35" stop-color="#f4f7f3"/>
      <stop offset="0.6" stop-color="#aeb8b0"/>
      <stop offset="1" stop-color="#8a948c"/>
    </linearGradient>
    <linearGradient id="slotGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0a202" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f0a202" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="floorGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <marker id="miniArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/>
    </marker>
  </defs>

  <ellipse cx="210" cy="530" rx="180" ry="16" fill="#000" opacity="0.25"/>
  <ellipse cx="210" cy="528" rx="120" ry="8" fill="url(#floorGlow)"/>

  <!-- Machine body -->
  <rect x="70" y="34" width="280" height="478" rx="26" fill="url(#body)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Left highlight -->
  <rect x="82" y="52" width="26" height="442" rx="13" fill="#ffffff" opacity="0.05"/>

  <!-- Top canopy -->
  <rect x="88" y="56" width="244" height="16" rx="8" fill="url(#canopy)" opacity="0.95"/>
  <rect x="88" y="82" width="244" height="58" rx="12" fill="url(#glass)"/>
  <g transform="translate(132,111)" stroke="#ffd166" stroke-width="3.2" fill="none" stroke-linecap="round">
    <path d="M 9.1 -6.4 A 11 11 0 0 1 6.4 9.1" marker-end="url(#miniArrow)"/>
    <path d="M 9.1 -6.4 A 11 11 0 0 1 6.4 9.1" transform="rotate(120)"/>
    <path d="M 9.1 -6.4 A 11 11 0 0 1 6.4 9.1" transform="rotate(240)"/>
  </g>
  <path d="M0,-4.6 C3.4,-4.6 4.7,-1.2 0,5.4 C-4.7,-1.2 -3.4,-4.6 0,-4.6 Z" transform="translate(132,111)" fill="#ffd166"/>
  <rect x="168" y="100" width="130" height="8" rx="4" fill="#ffd166" opacity="0.85"/>
  <rect x="168" y="116" width="88" height="6" rx="3" fill="#4ade80" opacity="0.6"/>

  <!-- Screen -->
  <rect x="100" y="158" width="220" height="116" rx="12" fill="url(#screen)" stroke="#4ade80" stroke-opacity="0.35" stroke-width="1.5"/>
  <!-- Can icon on screen -->
  <g transform="translate(210,212)" stroke="#4ade80" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M-13,-22 h26 v36 a13,13 0 0 1 -26,0 z"/>
    <path d="M-13,-12 h26"/>
    <path d="M-7,-28 h14"/>
  </g>
  <path d="M186 250 h48" stroke="#4ade80" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
  <path d="M196 259 h28" stroke="#4ade80" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Deposit slot -->
  <rect x="98" y="300" width="224" height="46" rx="23" fill="#051b12" stroke="url(#slotGlow)" stroke-width="3"/>
  <rect x="120" y="318" width="180" height="10" rx="5" fill="#ffd166" opacity="0.9"/>

  <!-- Falling can -->
  <g transform="translate(210,286) rotate(-14)">
    <path d="M-11,-15 h22 v24 a11,11 0 0 1 -22,0 z" fill="url(#can)"/>
    <path d="M-11,-5 h22" stroke="#1d7a4f" stroke-width="5"/>
    <path d="M-6,-19 h12" stroke="#8a948c" stroke-width="2.4"/>
  </g>

  <!-- Retrieval door -->
  <rect x="106" y="378" width="208" height="88" rx="14" fill="#0a241b" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
  <rect x="196" y="418" width="28" height="6" rx="3" fill="#ffffff" opacity="0.25"/>
  <circle cx="242" cy="421" r="4" fill="#ffd166" opacity="0.8"/>

  <!-- Corner screws -->
  <circle cx="88" cy="52" r="3.2" fill="#ffffff" opacity="0.2"/>
  <circle cx="332" cy="52" r="3.2" fill="#ffffff" opacity="0.2"/>
  <circle cx="88" cy="494" r="3.2" fill="#ffffff" opacity="0.2"/>
  <circle cx="332" cy="494" r="3.2" fill="#ffffff" opacity="0.2"/>

  <!-- Side accent -->
  <rect x="330" y="150" width="9" height="210" rx="4.5" fill="#f0a202" opacity="0.85"/>
</svg>
